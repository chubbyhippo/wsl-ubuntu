# Global mise tool set -> ~/.config/mise/config.toml (installed by init.sh).
# Runtimes for init.el's languages (go, node, erlang, elixir, perl, zig + zls)
# plus the JVM build tools and python (also the jupyterlab.sh venv base).
# "lts" only resolves for tools whose mise core plugin ships an LTS alias
# (java, node); the rest have no LTS release concept, so "latest" is the
# correct/only pin — setting "lts" there would fail to resolve.
[tools]
java = "lts"
maven = "latest"
gradle = "latest"
go = "latest"
perl = "latest"
python = "latest"
node = "lts"
erlang = "latest"
elixir = "latest"
zig = "latest"
zls = "latest"
jq = "latest"
